<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cantera Stats">
<meta name="description" content="Cantera Stats · Estadísticas de baloncesto formativo: tiros, rebotes, recuperaciones, faltas y valoración.">
<title>Cantera Stats · Estadísticas de baloncesto formativo</title>
<!-- %SITE_URL% se sustituye al compilar (scripts/postbuild.mjs) -->
<link rel="canonical" href="%SITE_URL%/minibasket-stats/">
<meta property="og:site_name" content="Cantera Stats">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_ES">
<meta property="og:title" content="Cantera Stats · App gratis de estadísticas de baloncesto formativo">
<meta property="og:description" content="Apunta tiros, rebotes, recuperaciones, asistencias y faltas de cada jugador desde el móvil durante el partido. Gratis, sin registro y sin conexión.">
<meta property="og:url" content="%SITE_URL%/minibasket-stats/">
<meta property="og:image" content="%SITE_URL%/og/cantera-stats.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Cantera Stats: estadísticas de baloncesto formativo desde el móvil">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
<script>
  // Aplicar el tema antes de pintar (misma preferencia que el marcador)
  try { if (localStorage.getItem('mb_theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
</script>
</head>
<body>
  <div id="app"></div>
  <div id="modal" hidden></div>
  <div id="toast" hidden></div>

  <div id="rotate">
    <div class="splash-brand">
      <svg class="splash-logo" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="#ff8a00"/>
        <circle cx="50" cy="50" r="46" fill="url(#ballShade)"/>
        <g fill="none" stroke="#2a1300" stroke-width="3.2" stroke-linecap="round">
          <circle cx="50" cy="50" r="46"/>
          <path d="M4 50h92M50 4v92"/>
          <path d="M18 18c14 14 14 50 0 64M82 18c-14 14-14 50 0 64"/>
        </g>
        <defs>
          <radialGradient id="ballShade" cx="35%" cy="30%" r="75%">
            <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
            <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity=".25"/>
          </radialGradient>
        </defs>
      </svg>
      <h1 class="splash-name">Cantera <span>Stats</span></h1>
      <p class="splash-tag">Estadísticas de baloncesto formativo</p>
      <p class="splash-privacy"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Sin registro ni seguimiento: tus datos se quedan en tu móvil</span></p>
    </div>
    <div class="install" id="install" hidden></div>
    <div class="rotate-hint">
      <div class="rotate-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg></div>
      <p>Gira el dispositivo</p>
      <small>La app está pensada para usarse en horizontal</small>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
