name: Tests

# Se ejecuta en cada push a cualquier rama: los PR desde ramas de este repositorio muestran el resultado de ese push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E (Chrome en Android y Safari en iPhone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
